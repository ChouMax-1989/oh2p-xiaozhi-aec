name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public export checks
        run: python tools/check_public.py
      - name: Python syntax
        run: python -m compileall -q server
      - name: Install packages and upgrade preservation
        run: |
          python -m unittest discover -s tools -p test_package_release.py -v
          sh edge/tests/test-install.sh
      - name: Firmware copy sanitization tests
        run: python -m unittest discover -s firmware -p test_sanitize_live.py -v
      - name: Realtime state tests
        run: PYTHONPATH=server/app python -m unittest discover -s server/tests -p test_realtime.py -v
      - name: Reader protocol tests
        run: |
          cargo test --locked --offline --no-run --message-format=json --manifest-path edge/aec/reader/Cargo.toml --bin fvsh-reader > "$RUNNER_TEMP/oh2p-reader-tests.jsonl"
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          artifacts = [json.loads(line) for line in
                       (pathlib.Path(os.environ["RUNNER_TEMP"]) / "oh2p-reader-tests.jsonl").read_text().splitlines()]
          executables = {item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item.get("target", {}).get("name") == "fvsh-reader"
                         and item.get("profile", {}).get("test")
                         and item.get("executable")}
          if len(executables) != 1:
              raise SystemExit(f"Expected one reader test executable, got {len(executables)}")
          subprocess.run(["sudo", "-n", executables.pop()], check=True)
          PY
      - name: Playback adapter tests
        run: cargo test --locked --offline --manifest-path edge/aec/reader/Cargo.toml --bin aplay
      - name: Owner unit tests
        run: cargo test --locked --offline --manifest-path edge/aec/preserved/vpm-owner/Cargo.toml
      - name: Shell syntax
        run: find edge server -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
  container:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build clean public server and test dependencies
        run: docker build --target test -t oh2p-xiaozhi-tests ./server
      - name: Offline integration tests
        run: docker run --rm --network none oh2p-xiaozhi-tests
