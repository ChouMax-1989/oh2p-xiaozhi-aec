name: Build OH2P firmware candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clean builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblzma-dev zlib1g-dev liblzo2-dev liblz4-dev libzstd-dev curl patch openssl python3 tar zip
      - name: Rebuild from fixed official OTA and upstream patches
        run: sudo bash firmware/build.sh --public-default --out "$RUNNER_TEMP/oh2p-firmware"
      - name: Package clearly marked candidate
        run: |
          cp docs/FIRMWARE.md "$RUNNER_TEMP/oh2p-firmware/release/READ-ME-FIRST.md"
          cd "$RUNNER_TEMP/oh2p-firmware/release"
          zip -9 "$RUNNER_TEMP/OH2P-1.62.2-firmware-candidate.zip" boot.img.encrypt dtb.img.encrypt root-original.squashfs root-ssh-candidate.squashfs firmware-manifest.json SHA256SUMS READ-ME-FIRST.md
          cd "$RUNNER_TEMP"
          sha256sum OH2P-1.62.2-firmware-candidate.zip > OH2P-FIRMWARE-SHA256SUMS
      - name: Upload candidate separately from tested application packages
        run: |
          gh release view v2026.10.24.1
          gh release upload v2026.10.24.1 "$RUNNER_TEMP/OH2P-1.62.2-firmware-candidate.zip" "$RUNNER_TEMP/OH2P-FIRMWARE-SHA256SUMS"
