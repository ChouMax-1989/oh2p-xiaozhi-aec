# Synthetic known layout. Playback sections are deliberately absent.
pcm.mico_record {
    type plug
    slave.pcm {
        type hw
        card 0
        device 3
    }
}
pcm.noop {
    type plug
    slave.pcm Capture
}
pcm.Capture {
    type plug
    slave.pcm {
        type dsnoop
        ipc_key 1024
        ipc_perm 0666
        slave {
            pcm "hw:0,3"
            rate 48000
            format S32_LE
            channels 4
            period_size 384
            buffer_size 6144
        }
    }
}
