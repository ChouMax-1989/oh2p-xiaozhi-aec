name: Historical firmware candidate (not for installation)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clean builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblzma-dev zlib1g-dev liblzo2-dev liblz4-dev libzstd-dev curl patch openssl python3 tar zip
      - name: Rebuild from fixed official OTA and upstream patches
        run: sudo bash firmware/build.sh --public-default --out "$RUNNER_TEMP/oh2p-firmware"
      - name: Package clearly marked candidate
        run: |
          sudo cp docs/FIRMWARE.md "$RUNNER_TEMP/oh2p-firmware/release/READ-ME-FIRST.md"
          cd "$RUNNER_TEMP/oh2p-firmware/release"
          zip -9 "$RUNNER_TEMP/OH2P-1.62.2-firmware-candidate.zip" boot.img.encrypt dtb.img.encrypt root-original.squashfs root-ssh-candidate.squashfs firmware-manifest.json SHA256SUMS READ-ME-FIRST.md
          cd "$RUNNER_TEMP"
          sha256sum OH2P-1.62.2-firmware-candidate.zip > OH2P-FIRMWARE-SHA256SUMS
      - name: Upload candidate separately from tested application packages
        run: |
          tag=firmware-1.62.2-candidate-20261024
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --latest=false --target "$GITHUB_SHA" --title '【历史资料·请勿用于安装】旧 OH2P 固件候选' --notes '此版只保留历史构建资料，不用于当前安装教程。请从仓库首页选择当前应用安装包；需要固件时查看 docs/LIVE-FIRMWARE.md 的现机脱敏版。此旧候选尚未刷机验收。'
          fi
          gh release upload "$tag" "$RUNNER_TEMP/OH2P-1.62.2-firmware-candidate.zip" "$RUNNER_TEMP/OH2P-FIRMWARE-SHA256SUMS"
